<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pano Etiketi</title>
<link rel="icon" href="../ortak/varliklar/ikon.svg" type="image/svg+xml">
<style>
/* ELECTRICX teması: koyu grafit, Dolfin kırmızısı. Etiket kâğıdı ve baskı renkleri çizimde kalır. */
:root{
  color-scheme:dark;
  --bg:#14161b;--panel:#1b1e25;--panel2:#23272f;--panel3:#2b3039;--hover:#363c47;--line:#2f343e;--line2:#3a404c;--ink:#e8eaef;--muted:#aab0bc;--faint:#8e96a6;
  --accent:#d40000;--accent-d:#ff0000;--accent-t:#ff8585;--accent-soft:rgba(255,0,0,.14);--blue:#8ab4ff;--blue-soft:rgba(91,157,255,.16);--warn:#f5a524;--warn-soft:rgba(245,165,36,.14);
  --on:#e8eaef;--on-ink:#14161b;--stage:#30343c;--r:6px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden;
  display:grid;grid-template-rows:52px minmax(0,1fr) 44px;min-width:1080px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h2,h3,p{margin:0}
a{color:var(--blue)}
kbd{font:11px/1 ui-monospace,Consolas,monospace;background:var(--panel3);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 4px}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:6px;border:2px solid var(--panel)}::-webkit-scrollbar-thumb:hover{background:var(--line2)}

/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap}
.brand i{width:22px;height:22px;border:2px solid var(--ink);border-radius:3px;position:relative;display:block}
.brand i:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent-d);left:6px;top:6px}
#pname{width:150px;height:30px;border:1px solid transparent;border-radius:var(--r);padding:0 8px;background:var(--panel2);font-weight:600;text-overflow:ellipsis}
#pname:hover{border-color:var(--line2)}#pname:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--panel3)}
#pname[readonly]{background:transparent;cursor:default}#pname[readonly]:hover{border-color:transparent}#pname[readonly]:focus{outline:0;background:transparent}
.sep{width:1px;height:24px;background:var(--line);flex:none}
.btn{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel3);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}.btn:active{background:var(--panel2)}.btn:disabled{opacity:.42;cursor:default;background:var(--panel3)}
.btn:focus-visible,.seg button:focus-visible,.card:focus-visible,.chip:focus-visible,.tab:focus-visible,.phrase:focus-visible{outline:2px solid var(--accent-d);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--panel3)}
.btn.icon{width:30px;padding:0}
.btn.danger{color:var(--accent-t);border-color:#6b2b2b}.btn.danger:hover{background:var(--accent-soft)}
.btn svg{width:15px;height:15px;flex:none}
.spacer{flex:1 1 auto;min-width:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel2);flex:none}
.seg button{border:0;background:transparent;height:28px;min-width:32px;padding:0 7px;border-right:1px solid var(--line);font-weight:600;font-size:12px}
.seg button:last-child{border-right:0}.seg button:hover{background:var(--panel3)}
.seg button.on{background:var(--on);color:var(--on-ink)}
.seg button.on2{background:var(--accent);color:#fff}
.lbl{font-size:11px;color:var(--muted);white-space:nowrap}
select{height:30px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);padding:0 4px}
#dirty{width:7px;height:7px;border-radius:50%;background:var(--accent-d);margin-left:-2px;visibility:hidden;flex:none}

/* main */
#app{display:grid;grid-template-columns:268px minmax(0,1fr) 304px;min-height:0}
#app.std{grid-template-columns:min(600px,42vw) minmax(0,1fr) 304px}
aside{background:var(--panel);min-height:0;overflow:auto}
#lib{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#props{border-left:1px solid var(--line)}
.libtabs{display:flex;padding:8px 10px 0;gap:2px;border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.libtabs button{flex:1;border:0;background:none;padding:6px 2px 8px;white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.libtabs button:hover{color:var(--ink)}
.libtabs button.on{color:var(--ink);border-bottom-color:var(--accent-d)}
.libbody{overflow:auto;flex:1;padding:4px 8px 14px}
.grp{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:12px 4px 5px}
.card{display:flex;width:100%;gap:9px;align-items:center;text-align:left;border:1px solid transparent;background:none;padding:5px;border-radius:var(--r);cursor:grab}
.card:hover{background:var(--panel3);border-color:var(--line)}
.card:active{cursor:grabbing}
.card .th{width:46px;height:46px;flex:none;border-radius:5px;border:1px solid var(--line);background:#fff;object-fit:contain;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card b{display:block;font-weight:600;font-size:12.5px;line-height:1.25}
.card span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.card code{font:10.5px ui-monospace,Consolas,monospace;color:var(--blue)}
.phrase{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:5px;line-height:1.25}
.phrase:hover{background:var(--panel3)}
.phrase b{font-weight:600;font-size:12px}.phrase span{display:block;color:var(--accent-t);font-weight:600;font-size:11px}
.stdh{font-size:12.5px;font-weight:700;margin:16px 4px 6px}
.stdp{font-size:12px;line-height:1.45;color:#c6cbd5;margin:0 4px 8px}
.stdt{width:calc(100% - 8px);margin:0 4px 8px;border-collapse:collapse;font-size:11.5px;line-height:1.35}
.stdt th{text-align:left;font-weight:600;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line2)}
.stdt td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.stdt td:first-child{font-weight:600}
.stdt tr.go{cursor:pointer}.stdt tr.go:hover td{background:var(--panel3)}
.chipS{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700;white-space:nowrap}
.chipS.ok{background:rgba(63,181,111,.18);color:#7fd6a2}.chipS.bad{background:var(--accent-soft);color:var(--accent-t)}.chipS.warn{background:var(--warn-soft);color:#f5c068}
.tagY{display:inline-block;padding:0 5px;border-radius:4px;font-size:10px;font-weight:700;background:var(--panel3);color:var(--muted);white-space:nowrap}
.callout{background:var(--warn-soft);border:1px solid #6b5620;border-radius:6px;padding:8px 10px;margin:0 4px 10px;font-size:11.5px;line-height:1.45;color:#f5c068}
.stdin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 4px 8px}
.stdsrc{margin:0 4px 8px;padding:0;list-style:none;font-size:11.5px;line-height:1.4}
.stdsrc li{padding:5px 0;border-bottom:1px solid var(--line)}
.stdsrc a{color:var(--blue);font-weight:600;text-decoration:none}.stdsrc a:hover{text-decoration:underline}
.stdsrc span{display:block;color:var(--muted)}
.pairl{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:2px 8px}
.pairl .chk span small{display:block;color:var(--muted);font-size:11px}
.hint{font-size:11.5px;color:var(--muted);padding:8px 8px 2px;line-height:1.4}

/* stage */
#stage{position:relative;background:var(--stage);min-width:0;min-height:0;overflow:hidden;display:grid;grid-template:22px minmax(0,1fr)/22px minmax(0,1fr)}
#stage canvas{display:block;background:var(--panel)}
#rTop{grid-area:1/2;width:100%;height:22px;border-bottom:1px solid var(--line)}
#rLeft{grid-area:2/1;width:22px;height:100%;border-right:1px solid var(--line)}
#corner{grid-area:1/1;background:var(--panel);border:solid var(--line);border-width:0 1px 1px 0}
#cv{grid-area:2/2;width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:default}
#cv.pan{cursor:grab}#cv.panning{cursor:grabbing}
#cv .it{cursor:move}
#cv:not(.showfp) .fp{display:none}
#gOver,#gDims{pointer-events:none}
#cv.dimtool,#cv.dimtool .it{cursor:crosshair}
#cv.dimtool #gDimHit{pointer-events:none}
#gDimHit [data-dim]{cursor:move}
#dimBar{position:absolute;left:50%;top:23px;transform:translateX(-50%);display:none;align-items:center;gap:8px;background:var(--panel3);border:1px solid var(--line2);color:#fff;border-radius:8px;padding:4px 6px 4px 12px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.45);white-space:nowrap;z-index:2}
#dimBar input{width:82px;height:28px;border:0;border-radius:5px;padding:0 8px;font-weight:800;font-size:15px;color:var(--on-ink);background:#fff;text-align:right;font-variant-numeric:tabular-nums}
#dimBar .dimhint{font-size:11.5px;color:#c9ced6}
#dimBar b{font-size:15px;font-weight:800;color:#ffd27a}
#dimBar .btn{height:28px;background:#fff;color:var(--on-ink);border-color:#fff}
#dimBar .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#dimBar .btn.x{background:transparent;color:#fff;border-color:transparent;width:26px;padding:0}
#dimBar .segw{border-color:#5a616b}#dimBar .segw button{background:transparent;color:#fff;border-color:#5a616b;padding:0 8px}#dimBar .segw button.on{background:#fff;color:var(--on-ink)}
#cv:focus{outline:none}
.ov-t{font-family:"Segoe UI",system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
#stage.real{background:#3f444c}
#viewbar{position:absolute;left:32px;bottom:10px;max-width:calc(100% - 42px);flex-wrap:wrap;display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#viewbar .btn{height:26px;border-color:transparent;background:transparent;font-size:12px;padding:0 8px}
#viewbar .btn:hover{background:var(--panel3)}
#viewbar .btn.on{background:var(--accent-soft);color:#fff;font-weight:600}
#zoomv{min-width:44px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
#cursor{position:absolute;right:10px;bottom:10px;background:rgba(27,30,37,.92);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);pointer-events:none}
#issuesBtn{position:absolute;right:10px;top:32px;display:none;height:38px;padding:0 14px;gap:8px;border:2px solid #fff;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:14.5px;box-shadow:0 2px 12px rgba(180,0,0,.55)}
#issuesBtn:hover{background:var(--accent-d)}
#issuesBtn svg{width:18px;height:18px}
#issuesBtn.pulse{animation:issuePulse 1.1s ease-out 2}
@keyframes issuePulse{0%{box-shadow:0 0 0 0 rgba(255,0,0,.75)}100%{box-shadow:0 0 0 18px rgba(255,0,0,0)}}
@media(prefers-reduced-motion:reduce){#issuesBtn.pulse{animation:none}}
#issuesPop{position:absolute;right:10px;top:76px;width:370px;max-height:calc(100% - 140px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;padding:4px}
#issuesPop button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:5px;padding:6px 8px;font-size:12px}
#issuesPop button b{display:block;font-weight:700;font-size:12px;line-height:1.3}
#issuesPop button span{display:block;color:#c6cbd5;line-height:1.35}
#issuesPop button em{font-style:normal;font-weight:800;font-size:13px;color:var(--accent-t)}
#issuesPop .ir{transition:background .08s}
#issuesPop .ir.hot{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent),0 0 10px rgba(255,0,0,.35)}
#issuesPop .ir{display:flex;align-items:center;gap:4px;border-radius:5px}
#issuesPop .ir>button:first-child{flex:1;min-width:0}
#issuesPop .fix{flex:none;width:auto;height:26px;border:1px solid var(--line2);background:var(--panel3);font-weight:600;white-space:nowrap;margin-right:4px}
.covrow{display:flex;gap:9px;align-items:center}
.covrow img{width:44px;height:38px;object-fit:contain;flex:none;border:1px solid var(--line);border-radius:5px;background:#fff}

/* props */
.sec{padding:12px;border-bottom:1px solid var(--line)}
.sec h3{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.ttl{font-size:14px;font-weight:700;line-height:1.25}
.subttl{font-size:11.5px;color:var(--muted);margin-top:2px}
.subttl code{font:11px ui-monospace,Consolas,monospace;color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:block;min-width:0}
.f>span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.f input,.f select,.f textarea{width:100%}
input.n,input.t,textarea{height:30px;border:1px solid var(--line);border-radius:var(--r);padding:0 8px;background:var(--panel2);min-width:0}
input.n{font-variant-numeric:tabular-nums;text-align:right}
textarea{height:auto;padding:5px 8px;resize:vertical;line-height:1.3;font-weight:600;font-size:12.5px;display:block}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.unit{position:relative;display:block}.unit::after{content:"mm";position:absolute;right:7px;top:8px;font-size:10.5px;color:var(--faint);pointer-events:none}
.unit input.n{padding-right:30px}
.rowbtn{display:flex;flex-wrap:wrap;gap:6px}
.rowbtn .btn{flex:1 1 auto}
.segw{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.segw button{flex:1;border:0;background:var(--panel2);height:28px;border-right:1px solid var(--line);font-size:12px}
.segw button:last-child{border:0}.segw button:hover{background:var(--panel3)}
.segw button.on{background:var(--on);color:var(--on-ink);font-weight:600}
.tr{margin-bottom:7px}
.tr textarea{width:100%}
.tr>span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-bottom:2px}
.tr>span em{font-style:normal;font-size:10px;font-weight:700;padding:0 5px;border-radius:9px;background:var(--panel3);color:var(--muted)}
.tr.pri>span em{background:var(--on);color:var(--on-ink)}.tr.sec2>span em{background:var(--accent);color:#fff}
.tr.miss textarea{background:var(--warn-soft);border-color:#6b5620}
.chk{display:flex;gap:7px;align-items:flex-start;padding:3px 0;cursor:pointer}
.chk input{margin:2px 0 0;accent-color:var(--accent-d);flex:none}
details summary{cursor:pointer;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;list-style-position:inside}
details[open] summary{margin-bottom:8px}
.note{font-size:11.5px;color:var(--muted);line-height:1.4}

/* tabs */
#foot{display:flex;align-items:stretch;min-width:0;background:var(--panel);border-top:1px solid var(--line)}
#tabs{display:flex;flex:1 1 auto;align-items:center;gap:6px;padding:0 10px;overflow-x:auto;min-width:0}
#docInfo{flex:0 1 auto;max-width:42%;display:flex;align-items:center;gap:5px;padding:0 12px;border-left:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#docInfo b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
#docInfo .tabwarn{color:var(--accent-t);font-weight:700;margin-right:6px}
.tab{display:flex;align-items:center;gap:7px;height:30px;padding:0 4px 0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);white-space:nowrap;cursor:pointer;flex:none}
.tab:hover{background:var(--panel3)}
.tab.on{background:var(--panel3);border-color:var(--accent);box-shadow:inset 0 2px 0 var(--accent-d);color:#fff}
.tab small{opacity:.7;font-size:11px}
.tab .qty{font-weight:700;color:var(--accent-t);font-size:11px}.tab.on .qty{color:#ffb7a8}
.tab .x{width:20px;height:20px;border:0;background:none;color:inherit;border-radius:4px;opacity:.55;display:flex;align-items:center;justify-content:center;padding:0}
.tab .x:hover{opacity:1;background:rgba(127,127,127,.25)}

/* dialogs */
dialog{border:0;border-top:3px solid var(--accent-d);border-radius:8px;padding:0;background:var(--panel);box-shadow:0 20px 50px rgba(0,0,0,.6);width:440px;max-width:94vw;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{padding:14px 16px 0;font-size:15px;font-weight:700}
.db{padding:12px 16px}.db .f,.db .grid2{margin-bottom:10px}
.df{padding:10px 16px 14px;display:flex;justify-content:flex-end;gap:8px}
.opt{display:block;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:6px;cursor:pointer}
.opt:hover{background:var(--panel2)}.opt input{margin-right:7px;accent-color:var(--accent-d)}
.langs{display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 8px 22px}
.flist{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:8px}
.flist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--panel2);padding:8px 10px}
.flist button:last-child{border:0}.flist button:hover{background:var(--panel3)}
.flist button b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;word-break:break-all}
.flist button span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.flist button.badfile{color:var(--accent-t);cursor:default;background:var(--panel2)}
.seg.place button{min-width:104px;height:30px}
.flist .now{flex:none;font-size:10px;font-weight:700;padding:0 6px;border-radius:9px;background:var(--on);color:var(--on-ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:14px;height:26px;padding:0 10px;font-size:12px}
.chip:hover{background:var(--panel3)}
@media(max-width:1400px){.lbl{display:none}#pname{width:110px}}
@media(max-width:1240px){.brand{font-size:0;gap:0}#top{gap:5px}#top .btn{padding:0 7px}#bLangAll{font-size:0}#bLangAll::after{content:"Tümü";font-size:13px}}
@media(max-width:1300px){#app.std #cursor{display:none}}
#toast{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);background:var(--panel3);color:var(--ink);border-left:3px solid #3fb56f;border-radius:5px;padding:8px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .15s;max-width:70vw;z-index:9}
#toast.on{opacity:1}#toast.err{border-left-color:var(--accent-d)}
</style>
</head>
<body>

<header id="top">
  <div class="brand"><i></i>Pano Etiketi</div>
  <input id="pname" aria-label="Proje adı" title="Proje adı. Dosya adını değiştirmek için Farklı kaydet'i kullan.">
  <span id="dirty" title="Kaydedilmemiş değişiklik var"></span>
  <button class="btn" id="bNew">Yeni</button>
  <button class="btn" id="bOpen">Aç</button>
  <button class="btn" id="bSave" title="Açık dosyaya kaydet (Ctrl+S)">Kaydet</button>
  <button class="btn" id="bSaveAs" title="Yeni bir dosya olarak kaydet (Ctrl+Shift+S)">Farklı kaydet</button>
  <span class="sep"></span>
  <button class="btn icon ghost" id="bUndo" title="Geri al (Ctrl+Z)" aria-label="Geri al"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 2.5 6.5 6 10"/><path d="M3 6.5h6.5a4 4 0 0 1 0 8H7"/></svg></button>

/* ---------- yol (path) araçları: M L C Z, mutlak koordinat ---------- */
function arcSeg(out,cx,cy,r,a0,a1,start,ry){
  ry=ry??r;
  const n=Math.max(1,Math.ceil(Math.abs(a1-a0)/90-1e-9)),st=(a1-a0)/n*Math.PI/180;let t=a0*Math.PI/180;
  const x0=cx+r*Math.cos(t),y0=cy+ry*Math.sin(t);
  if(start)out.push([start,x0,y0]);
  for(let i=0;i<n;i++){
    const t1=t+st,k=4/3*Math.tan(st/4);
    const c0=Math.cos(t),s0=Math.sin(t),c1=Math.cos(t1),s1=Math.sin(t1);
    out.push(['C',cx+r*(c0-k*s0),cy+ry*(s0+k*c0),cx+r*(c1+k*s1),cy+ry*(s1-k*c1),cx+r*c1,cy+ry*s1]);
    t=t1;
  }
  return out;
}
const circle=(cx,cy,r,ccw)=>{const o=[];arcSeg(o,cx,cy,r,0,ccw?-360:360,'M');o.push(['Z']);return o};
const rectP=(x,y,w,h)=>[['M',x,y],['L',x+w,y],['L',x+w,y+h],['L',x,y+h],['Z']];
const line=(x0,y0,x1,y1)=>[['M',x0,y0],['L',x1,y1]];
const parseCache=new Map();
function parseD(s){
  let r=parseCache.get(s);if(r)return r;
  r=[];const tk=s.match(/[MLQCZ]|-?\d+(?:\.\d+)?/g)||[];let i=0,cx=0,cy=0;
  while(i<tk.length){
    const c=tk[i++];
    if(c==='Z'){r.push(['Z']);continue}
    if(c==='M'||c==='L'){cx=+tk[i++];cy=+tk[i++];r.push([c,cx,cy])}
    else if(c==='Q'){const qx=+tk[i++],qy=+tk[i++],x=+tk[i++],y=+tk[i++];
      r.push(['C',cx+2/3*(qx-cx),cy+2/3*(qy-cy),x+2/3*(qx-x),y+2/3*(qy-y),x,y]);cx=x;cy=y}
    else if(c==='C'){const a=[+tk[i++],+tk[i++],+tk[i++],+tk[i++],+tk[i++],+tk[i++]];r.push(['C',...a]);cx=a[4];cy=a[5]}
  }
  parseCache.set(s,r);return r;
}
function xform(cmds,a,b,c,d,e,f){
  return cmds.map(s=>{
    if(s[0]==='Z')return s;const o=[s[0]];
    for(let i=1;i<s.length;i+=2){const x=s[i],y=s[i+1];o.push(a*x+c*y+e,b*x+d*y+f)}
    return o});
}
const shift=(cmds,dx,dy)=>xform(cmds,1,0,0,1,dx,dy);
function pathD(cmds){
  let o='';for(const s of cmds){o+=s[0];for(let i=1;i<s.length;i++)o+=(i>1?' ':'')+fx(s[i],3)}return o;
}

const missingChars=new Set();
function gl(fid,ch){
  const g=FONTS[fid].g[ch];
  if(g)return g;
  if(ch!=='\n')missingChars.add(ch);
  return null;
}
function measure(str,fid,fs,track=0){
  const F=FONTS[fid],arr=Array.from(String(str).normalize('NFC'));let w=0,prev=null;
  for(const ch of arr){
    const g=gl(fid,ch);
    if(prev&&F.k[prev+ch])w+=F.k[prev+ch];
    w+=g?g[0]:600;prev=ch;
  }
  return w*fs/1000+track*Math.max(0,arr.length-1);
}
function textCmds(str,fid,fs,x,y,opt={}){
  const{anchor='m',sx=1,track=0}=opt,F=FONTS[fid],s=fs/1000;
  const arr=Array.from(String(str).normalize('NFC'));
  const W=measure(str,fid,fs,track)*sx;
  let cx=anchor==='m'?x-W/2:anchor==='e'?x-W:x,prev=null;const out=[];
  for(const ch of arr){
    const g=gl(fid,ch);
    if(prev&&F.k[prev+ch])cx+=F.k[prev+ch]*s*sx;
    if(g){if(g[1]){for(const c of xform(parseD(g[1]),s*sx,0,0,-s,cx,y))out.push(c)}cx+=g[0]*s*sx}
    else{for(const c of rectP(cx+fs*.06,y-fs*.7,fs*.42,fs*.7))out.push(c);cx+=.6*fs*sx}
    cx+=track*sx;prev=ch;
  }
  return out;
}
function arcText(str,fid,fs,rad,top,track=.5){
  const F=FONTS[fid],s=fs/1000,arr=Array.from(String(str).normalize('NFC'));
  const total=measure(str,fid,fs,track);let pos=-total/2,prev=null;const out=[];
  for(const ch of arr){
    const g=gl(fid,ch);
    if(prev&&F.k[prev+ch])pos+=F.k[prev+ch]*s;
    const adv=(g?g[0]:600)*s,mid=pos+adv/2;
    if(g&&g[1]){
      const th=top?-Math.PI/2+mid/rad:Math.PI/2-mid/rad,rot=top?th+Math.PI/2:th-Math.PI/2;
      const c=Math.cos(rot),n=Math.sin(rot),px=rad*Math.cos(th),py=rad*Math.sin(th);
      // glif: x=>(gx-adv/2), y=>-gy
      for(const seg of xform(parseD(g[1]),s*c,s*n,n*s,-c*s,px-adv/2*c,py-adv/2*n))out.push(seg);
    }
    pos+=adv+track;prev=ch;
  }
  return out;
}

const DE_OLD={'AUFMACHEN':'opencover','GESCHLOSSEN':'closecover','KORB DREHEN':'test','ZURÜCKSETZEN':'reset','WASCHEN':'washing','ZEIT':'time','WASSERSTAND UNZUREICHEND':'lowwater','REDUZIERSTÜCK STÖRUNG':'gearfail'};
/* v9 gecisi: yeni yazilar uzun. Delik yerinde kalir, yazi yalniz genislikten daralir.
   Her adimda en genis olan daralir ki yan yana iki yazi dengeli kalsin.
   Daraltmakla cozulmeyen cakisma oldugu gibi birakilir, kullanici uyariyi gorur. */
function squeezeTexts(l,items){
  const W=l.w,ni=RN+BORDER_SW/2+.5,notches=[B,...l.sideY,l.h-B],PAD=3,MIN=.72;
  const box=it=>absBox(itemBoxes(it,l).tb,it);
  const hits=it=>{
    const b=box(it);
    if(!b)return false;
    if(b.x0<B+1||b.x1>W-B-1)return true;
    if(notches.some(y=>hitBox(b,{x0:0,y0:y-ni,x1:B+ni,y1:y+ni})||hitBox(b,{x0:W-B-ni,y0:y-ni,x1:W,y1:y+ni})))return true;
    const wide={x0:b.x0-PAD,y0:b.y0,x1:b.x1+PAD,y1:b.y1};
    return l.items.some(o=>{
      if(o===it)return false;
      const q=itemBoxes(o,l);
      return hitBox(wide,absBox(q.fp,o))||hitBox(wide,absBox(q.tb,o));
    });
  };
  const full=it=>{const m=it.maxW;it.maxW=0;const w=textBlock(it,l)?.w||0;it.maxW=m;return w};
  const wid=it=>textBlock(it,l)?.w||0;
  for(let n=0;n<120;n++){
    const can=items.filter(it=>hits(it)&&wid(it)-1>=full(it)*MIN).sort((a,b)=>wid(b)-wid(a));
    if(!can.length)break;
    can[0].maxW=+(wid(can[0])-1).toFixed(1);
  }
  for(const it of items)if(it.maxW&&hits(it))it.maxW=0;
  /* ayni butonlar ayni genislikte gorunsun */
  for(const it of items){
    if(!it.maxW)continue;
    for(const x of sameAs(it,l))if(wid(x)>it.maxW)x.maxW=it.maxW;
  }
}

function migrate(o){
  const v=o.version||1;
  if(v<2){
    for(const l of o.labels){
      l.auto=false;
      if(l.sideY.length<3){l.sideY=sideAuto(l.h,3);l.sideAuto=true}
      else if(l.sideAuto)l.sideY=sideAuto(l.h,l.sideY.length);
    }
  }
  if(v<3){
    if(o.rules&&o.rules.far===530)o.rules.far=550;
    for(const l of o.labels)for(const it of l.items)if(it.cat==='CIFTEL'&&it.fpw===40&&it.fph===40){it.fpw=30;it.fph=30}
  }
  if(v<4){
    for(const l of o.labels){
      if(!l.langs){const a=l.lang||'tr',b=l.lang2;l.langs=b&&b!=='none'&&b!==a?[a,b]:[a]}
      delete l.lang;delete l.lang2;
      resolveOverlaps(l);
    }
  }
  if(v<5){
    for(const l of o.labels)for(const it of l.items)it.cat=legacyCat(it);
  }
  if(v<6){
    for(const l of o.labels)for(const it of l.items)if(it.cat==='S14K'){
      const k=phraseKeyOf(it);if(k==='washing')it.cat='WASHLAMP';else if(k==='heater')it.cat='HEATLAMP';
    }
  }
  if(v<7){
    /* yag ayirici yazilari yag siyirici olur */
    const old=['YAĞ AYIRICI','OIL SEPARATOR','OIL SEPERATOR','ÖLABSCHEIDER',"SÉPARATEUR D'HUILE",'SEPARADOR DE ACEITE','SEPARATORE OLIO','МАСЛООТДЕЛИТЕЛЬ'].map(normTxt);
    for(const l of o.labels)for(const it of l.items)for(const k in it.t||{})if(old.includes(normTxt(it.t[k]))&&PHRASES.oil[1][k])it.t[k]=PHRASES.oil[1][k];
  }
  if(v<8){
    for(const l of o.labels)for(const it of l.items)if(catOf(it.cat)?.noText){it.tp='none';it.t={}}
  }
  if(v<9){
    for(const l of o.labels){
      const changed=[];
      for(const it of l.items){
        const de=it.t?.de;
        if(typeof de!=='string')continue;
        const n=normTxt(de);
        if(it.kind==='estop'){if(n==='NOT-AUS')it.t.de=ESTOP_T.de;continue}
        let k=DE_OLD[n];
        if(it.cat==='KAPAKAC'&&n==='TÜR OFFEN')k='opencover';
        if(it.cat==='KAPAKKAPA'&&n==='TÜR SCHLIESSEN')k='closecover';
        if(it.cat==='HEATLAMP'&&n==='HEIZUNG')k='heateron';
        if(k&&it.t.de!==PHRASES[k][1].de){it.t.de=PHRASES[k][1].de;changed.push(it)}
      }
      evenTexts(l);
      if(langsOf(l).includes('de'))squeezeTexts(l,changed);
    }
  }
  o.version=FORMAT_VERSION;
  o.fixed=Object.assign(fixedDefaults(),o.fixed||{});
  o.rules=Object.assign({},DEFAULT_RULES,o.rules||{});
  return o;
}

}

      else{const L={L:[0,0,0,l.h],R:[l.w,0,l.w,l.h],T:[0,0,l.w,0],B:[0,l.h,l.w,l.h]}[ref];if(L)S.push(`<line x1="${L[0]}" y1="${L[1]}" x2="${L[2]}" y2="${L[3]}" stroke="${col}" stroke-width="3.5" vector-effect="non-scaling-stroke"/>`)}

/* ---------- kontrol / uyarılar ---------- */
function computeIssues(l){
  const out=[],W=l.w,H=l.h,langs=langsOf(l),lim={x0:B+1,y0:B+1,x1:W-B-1,y1:H-FOOT_H};
  const G=l.items.map(it=>{const b=itemBoxes(it,l);return{it,fp:absBox(b.fp,it),tb:absBox(b.tb,it),n:itemTitle(it)}});
  for(const g of G){
    for(const b of[g.fp,g.tb]){
      if(!b)continue;
      if(b.x0<lim.x0||b.x1>lim.x1||b.y0<lim.y0){out.push({ids:[g.it.id],m:`${g.n}: çerçeveye taşıyor`});break}
      if(b.y1>lim.y1){out.push({ids:[g.it.id],m:`${g.n}: CNK alanına giriyor`});break}
    }
  }
  for(let i=0;i<G.length;i++)for(let j=i+1;j<G.length;j++){
    const a=G[i],b=G[j];
    if(hitBox(a.fp,b.fp)||hitBox(a.fp,b.tb)||hitBox(a.tb,b.fp)||hitBox(a.tb,b.tb))out.push({ids:[a.it.id,b.it.id],m:`${a.n} ile ${b.n} çakışıyor`});
  }
  /* civata noktalari ve koselerdeki cikintilar */
  const notches=[B,...l.sideY,H-B];
  const ni=RN+BORDER_SW/2+.5;
  for(const g of G){
    const hit=[g.fp,g.tb].some(b=>b&&notches.some(y=>hitBox(b,{x0:0,y0:y-ni,x1:B+ni,y1:y+ni})||hitBox(b,{x0:W-B-ni,y0:y-ni,x1:W,y1:y+ni})));
    if(hit)out.push({ids:[g.it.id],m:`${g.n}: cıvata noktasına giriyor`});
  }
  /* ayni buton ve cift el eslesmesi: ISO 13851 ic mesafe */
  for(const c of pairChecks(l)){
    const nm=c.a.cat===c.b.cat?catOf(c.a.cat).name:`${catOf(c.a.cat).name} + ${catOf(c.b.cat).name}`,ids=[c.a.id,c.b.id];
    const base={ids,k:`pair|${[...ids].sort().join('|')}`,pair:[c.a.id,c.b.id],gap:c.gap,title:nm};
    if(c.st==='near')out.push({...base,note:`en az ${nf(c.R.near)} mm olmalı (ISO 13851 7.2)`,dimNote:`en az ${nf(c.R.near)} mm`,m:`${nm}: iki buton arası ${nf(c.gap)} mm, en az ${nf(c.R.near)} mm olmalı (ISO 13851 7.2)`});
    else if(c.st==='cover')out.push({...base,note:`kapak gerekli (ISO 13851 7.3)`,dimNote:`kapak gerekli`,m:`${nm}: iki buton arası ${nf(c.gap)} mm, kapak gerekli (ISO 13851 7.3)`,fix:c.fix,fixLabel:c.fixLabel});
    else if(c.st==='ergo')out.push({...base,note:`${nf(c.R.ergo)} mm'yi aşmaması önerilir (ISO 13851:2002 8.3)`,dimNote:`en çok ${nf(c.R.ergo)} mm önerilir`,m:`${nm}: iki buton arası ${nf(c.gap)} mm, ${nf(c.R.ergo)} mm'yi aşmaması önerilir (ISO 13851:2002 8.3)`});
  }
  for(const it of l.items)if(it.hmiTest&&catOf(it.cat)?.digital&&!l.items.some(o=>o.cat==='SEPET'))out.push({ids:[it.id],m:`${catOf(it.cat).name}: Sepet Test seçili ama etikette Sepet Test butonu yok`});
  for(const it of l.items){
    if(it.cat!=='CIFTEL')continue;
    const sameCat=l.items.some(o=>o!==it&&o.cat==='CIFTEL');
    const referenced=l.items.some(o=>o!==it&&(o.pairs||[]).includes(it.id));
    const has=(it.pairs||[]).some(id=>l.items.some(o=>o.id===id));
    if(!sameCat&&!referenced&&!has)out.push({ids:[it.id],m:`Çift El Butonu: birlikte kullanılacak buton seçilmedi`});
  }
  for(const g of G){
    const it=g.it;if(!it.t||it.tp==='none')continue;
    for(const k of it.kind==='estop'?langs.slice(0,1):langs)if(!it.t[k])out.push({ids:[it.id],m:`${g.n}: ${LANGS[k]} metni eksik`});
  }
  return out;
}
/* kontrol edilecek ciftler: ayni stoktan iki buton ya da cift el ile sectigi buton */
function pairChecks(l){
  const R=P.rules||DEFAULT_RULES,btn=l.items.filter(i=>catOf(i.cat)?.btn),cand=l.items.filter(i=>catOf(i.cat)?.btn||catOf(i.cat)?.digital),seen=new Set(),out=[];
  const add=(a,b,kind)=>{
    const k=[a.id,b.id].sort().join('|');if(seen.has(k))return;seen.add(k);
    const gap=buttonGap(a,b),isTwoHand=a.cat==='CIFTEL'||b.cat==='CIFTEL';
    /* kapak yalniz fiziksel butona takilir, dokunmatik ekrana takilmaz */
    const cov=[a,b].filter(i=>catOf(i.cat)?.btn);
    const ok=R.coverBoth?cov.every(i=>i.cover):cov.some(i=>i.cover);
    let st='ok';
    if(gap<R.near)st='near';else if(gap<R.far&&!ok)st='cover';else if(isTwoHand&&gap>R.ergo)st='ergo';
    const low=(b.y>a.y||(b.y===a.y&&b.x>a.x))?b:a,high=low===a?b:a;
    const target=[low,high].find(i=>catOf(i.cat)?.btn&&!i.cover)||low;
    const label=cov.length<2?'Butona kapak ekle':target===low?'Alttakine kapak ekle':'Üsttekine kapak ekle';
    out.push({a,b,kind,gap,st,R,fix:target.id,fixLabel:label});
  };
  for(let i=0;i<btn.length;i++)for(let j=i+1;j<btn.length;j++)if(btn[i].cat===btn[j].cat)add(btn[i],btn[j],'same');
  for(const a of l.items){
    if(!catOf(a.cat)?.digital||!a.hmiTest)continue;
    for(const b of btn)if(b.cat==='SEPET')add(a,b,'hmi');
  }
  for(const a of btn){
    if(a.cat!=='CIFTEL')continue;
    for(const id of a.pairs||[]){const b=cand.find(q=>q.id===id);if(b)add(a,b,'pair')}
  }
  return out;
}
/* iki on yuzun birbirine bakan kenarlari arasi cizgi */
function gapSegment(a,b){
  if(a.fpw===a.fph&&b.fpw===b.fph){
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
    return[a.x+ux*a.fpw/2,a.y+uy*a.fpw/2,b.x-ux*b.fpw/2,b.y-uy*b.fpw/2];
  }
  const axis=(ca,ha,cb,hb)=>{
    const a0=ca-ha,a1=ca+ha,b0=cb-hb,b1=cb+hb;
    if(a1<b0)return[a1,b0];if(b1<a0)return[a0,b1];
    const m=(Math.max(a0,b0)+Math.min(a1,b1))/2;return[m,m];
  };
  const[x0,x1]=axis(a.x,a.fpw/2,b.x,b.fpw/2),[y0,y1]=axis(a.y,a.fph/2,b.y,b.fph/2);
  return[x0,y0,x1,y1];
}
function buttonGap(a,b){
  const dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);
  if(a.fpw===a.fph&&b.fpw===b.fph)return Math.hypot(dx,dy)-(a.fpw+b.fpw)/2;
  return Math.hypot(Math.max(0,dx-(a.fpw+b.fpw)/2),Math.max(0,dy-(a.fph+b.fph)/2));
}
function setHmiTest(it,on){
  const l=cur();
  it.hmiTest=on;
  if(on){
    if(!l.items.some(i=>i.cat==='SEPET')){addItem('SEPET',null,{keepSel:true,extra:{fromHmi:it.id}});renderProps();return}
  }else{
    const own=l.items.filter(i=>i.fromHmi===it.id).map(i=>i.id);
    if(own.length){
      l.items=l.items.filter(i=>!own.includes(i.id));
      for(const o of l.items)if(o.pairs)o.pairs=o.pairs.filter(x=>!own.includes(x));
    }
  }
  if(l.auto)autoArrange();else{render();renderProps();commit()}
}
function setCover(it,on){
  it.cover=on;
  if(on){it.cw=it.cw||COVER_W;it.ch=it.ch||COVER_H}
}
let hoverK=null,pinK=null,hotItem=null,lastIssueCount=0;
const issueKey=i=>i.k||i.m;
function issueRow(i,n){
  let body;
  if(i.pair)body=`<b>${esc(i.title)}</b><span>Aralarındaki mesafe <em>${esc(nf(i.gap))} mm</em>, ${esc(i.note)}</span>`;
  else{const p=i.m.indexOf(': ');body=p>0?`<b>${esc(i.m.slice(0,p))}</b><span>${esc(i.m.slice(p+2))}</span>`:`<span>${esc(i.m)}</span>`}
  return`<div class="ir" data-k="${esc(issueKey(i))}"><button data-n="${n}">${body}</button>${i.fix?`<button class="fix" data-fix="${i.fix}">${esc(i.fixLabel)}</button>`:''}</div>`;
}
function syncIssueRows(scroll){
  const act=hoverK??pinK;
  $$('#issuesPop .ir').forEach((r,n)=>{

function refreshIssues(){

    b.setAttribute('aria-expanded',popOpen());

}

let hist=[],hi=-1,savedJson='';
function resetHist(){const j=JSON.stringify(P);hist=[j];hi=0;savedJson=j;syncDirty();writeState()}
function commit(){
  const j=JSON.stringify(P);
  if(j===hist[hi])return;
  hist.length=hi+1;hist.push(j);if(hist.length>150){hist.shift()}hi=hist.length-1;
  syncDirty();autosave();
}
function undo(d){
  const n=hi+d;if(n<0||n>=hist.length)return;
  hi=n;P=JSON.parse(hist[hi]);if(doc.file)P.name=displayName(doc.file);A=clamp(A,0,P.labels.length-1);sel.clear();
  syncAll();syncDirty();autosave();
}
function syncDirty(){
  $('#dirty').style.visibility=hist[hi]!==savedJson?'visible':'hidden';
  $('#bUndo').disabled=hi<=0;$('#bRedo').disabled=hi>=hist.length-1;
}
/* Sayfa yenilenince ayni proje ve ayni dosya ile devam etmek icin.

const STATE_KEY='electricx.etiket.durum';
let asT=0;
function writeState(){
  clearTimeout(asT);
  if(!hist.length)return;
  const rec=JSON.stringify({json:hist[hi],file:doc.file,dir:doc.dir,mod:doc.mod,gh:!!doc.gh,sha:doc.sha||null,clean:hist[hi]===savedJson,active:A});
  try{sessionStorage.setItem(STATE_KEY,rec)}catch(e){}

}

}

  return`

/* ---------- ekleme ve otomatik yerleşim ---------- */
function workArea(l){
  const lg=l.items.find(i=>i.kind==='logo');
  const top=lg?lg.y+lg.w*LOGO_RATIO/2+8:B+6;
  return{top,bottom:l.h-FOOT_H-3,left:B+RN+2,right:l.w-B-RN-2};
}
function rectsOf(it,l){const b=itemBoxes(it,l);return[absBox(b.fp,it),absBox(b.tb,it)].filter(Boolean)}
function kidsOf(it,l){return l.items.filter(c=>c.link===it.id)}
/* ogenin kendisi + ona bagli yazilar (yerel koordinat) */
function groupBox(it,l){
  const b=unionBox(it,l);
  for(const c of kidsOf(it,l)){
    const q=absBox(unionBox(c,l),c);
    b.x0=Math.min(b.x0,q.x0-it.x);b.x1=Math.max(b.x1,q.x1-it.x);b.y0=Math.min(b.y0,q.y0-it.y);b.y1=Math.max(b.y1,q.y1-it.y);
  }
  return b;
}
/* ORDEL'in yan yazilari: yana sigarsa yanda, sigmazsa altta */
function layoutLinked(p,l){
  if(p.cat==='OILSW'){
    for(const c of kidsOf(p,l)){
      c.y=p.y;
      c.x=c.cat==='OILLAMP'?l.w-p.x:l.w/2;
    }
    return;
  }
  const a=workArea(l),[hx,hy]=fpHalf(p);
  kidsOf(p,l).forEach((c,i)=>{
    const q=unionBox(c,l),tw=(q.x1-q.x0)/2,th=q.y1-q.y0,side=i%2?1:-1;
    const cx=clamp(p.x+side*Math.max(81,hx+tw+4),a.left+tw,Math.max(a.left+tw,a.right-tw));
    if(Math.abs(cx-p.x)-tw<hx+2){
      c.x=clamp(p.x+side*(tw+3),a.left+tw,Math.max(a.left+tw,a.right-tw));c.y=p.y+hy+4+th/2;
    }else{c.x=cx;c.y=p.y+hy-th/2-4}
    c.x=Math.round(c.x*2)/2;c.y=Math.round(c.y*2)/2;
  });
}
/* verilen dikdortgenler icin en yakin bos konum */
function nearestFree(rects,others,l){
  const W=l.w,H=l.h,m=1;
  const hit=(dx,dy)=>rects.some(r=>others.some(o=>hitBox({x0:r.x0+dx,y0:r.y0+dy,x1:r.x1+dx,y1:r.y1+dy},o,m)));
  const inside=(dx,dy)=>rects.every(r=>r.x0+dx>=B+1&&r.x1+dx<=W-B-1&&r.y0+dy>=B+1&&r.y1+dy<=H-FOOT_H);
  if(!hit(0,0))return{dx:0,dy:0};
  for(let rad=3;rad<=Math.max(W,H);rad+=3){
    const n=Math.max(8,Math.ceil(2*Math.PI*rad/5));
    for(let k=0;k<n;k++){
      const t=Math.PI/2+2*Math.PI*k/n;
      const dx=Math.round(rad*Math.cos(t)*2)/2,dy=Math.round(rad*Math.sin(t)*2)/2;
      if(inside(dx,dy)&&!hit(dx,dy))return{dx,dy};
    }
  }
  return null;
}
function settle(group,l){
  const ids=new Set(group.map(i=>i.id));
  const others=l.items.filter(o=>!ids.has(o.id)).flatMap(o=>rectsOf(o,l));
  const f=nearestFree(group.flatMap(i=>rectsOf(i,l)),others,l);
  if(!f||(!f.dx&&!f.dy))return false;
  for(const i of group){i.x+=f.dx;i.y+=f.dy}
  return true;
}
/* elle dizilimde dil degisince: bagli yazilari toparla, ust uste gelenleri asagi kaydir */
function resolveOverlaps(l){
  let moved=false;
  for(const p of l.items){
    const kids=kidsOf(p,l);if(!kids.length)continue;
    const others=l.items.filter(o=>!kids.includes(o)).flatMap(o=>rectsOf(o,l));
    if(kids.some(c=>rectsOf(c,l).some(r=>others.some(o=>hitBox(r,o,1))))){layoutLinked(p,l);moved=true}
  }
  const ids=new Set(l.items.map(i=>i.id));
  const groups=l.items.filter(i=>!i.link||!ids.has(i.link)).map(it=>({it,kids:kidsOf(it,l)}));
  const rectsG=g=>[g.it,...g.kids].flatMap(i=>rectsOf(i,l));
  const top=g=>{const r=rectsG(g);return r.length?Math.min(...r.map(q=>q.y0)):Infinity};
  groups.sort((a,b)=>(a.it.kind==='logo'?-1:0)-(b.it.kind==='logo'?-1:0)||top(a)-top(b));
  const placed=[];
  for(const g of groups){
    if(g.it.kind!=='logo'){
      for(let n=0;n<60;n++){
        let dy=0;
        for(const r of rectsG(g))for(const o of placed)if(hitBox(r,o,2))dy=Math.max(dy,o.y1+2-r.y0);
        if(!dy)break;
        dy=Math.ceil(dy*2)/2||.5;
        g.it.y+=dy;g.kids.forEach(c=>c.y+=dy);moved=true;
      }
    }
    placed.push(...rectsG(g));
  }
  return moved;
}
function findSpot(it,l,forceCenter){
  const a=workArea(l),b=unionBox(it,l),W=l.w,bw=b.x1-b.x0;
  let cols=bw>W*.5||forceCenter?[W/2]:[W*.2,W*.8,W*.5];
  const others=l.items.filter(o=>o.id!==it.id).flatMap(o=>{const q=itemBoxes(o,l);return[absBox(q.fp,o),absBox(q.tb,o)].filter(Boolean)});
  for(let y=a.top-b.y0;y+b.y1<=a.bottom;y+=4){
    for(const x of cols){
      const x0=clamp(x,a.left-b.x0,a.right-b.x1);
      const q={x0:x0+b.x0,y0:y+b.y0,x1:x0+b.x1,y1:y+b.y1};
      if(!others.some(o=>hitBox(q,o,3)))return{x:Math.round(x0*2)/2,y:Math.round(y*2)/2};
    }
  }
  return null;
}
function addItem(catId,pos,opt){
  const combo=catId==='OILSET';if(combo)catId='OILSW';
  const l=cur(),it=mkItem(catId,0,0,null,opt?.extra);
  const twin=SAME_TEXT.has(catId)&&l.items.find(x=>x.cat===catId);
  if(twin)it.t=clone(twin.t||{});
  if(it.kind==='logo'){it.w=logoWidth(l.w);it.x=l.w/2;it.y=24+it.w*LOGO_RATIO/2}
  const screen=catId==='NB7W'||catId==='OC990';
  if(pos){it.x=Math.round(pos.x*2)/2;it.y=Math.round(pos.y*2)/2;markManual(l)}
  else if(it.kind!=='logo'&&l.auto){const a=workArea(l);it.x=l.w/2;it.y=(a.top+a.bottom)/2}
  else if(it.kind!=='logo'){
    const sp=findSpot(it,l,screen||it.kind==='estop');
    if(sp){it.x=sp.x;it.y=sp.y}
    else{const a=workArea(l);it.x=l.w/2;it.y=Math.round((a.top+a.bottom)/2);toast('Boş yer kalmadı, ortaya eklendi. Taşıyarak yerleştir.')}
  }
  l.items.push(it);
  const added=[it.id];
  if(catId==='OC990'){
    l.items.push(mkItem('TEXT',it.x-81,it.y+37,'temp',{link:it.id}),mkItem('TEXT',it.x+81,it.y+37,'time',{link:it.id}));
    layoutLinked(it,l);
  }
  if(combo){
    if(!pos&&!l.auto)it.x=Math.round(Math.max(l.w*.22,workArea(l).left+15));
    l.items.push(mkItem('OILLAMP',0,0,null,{link:it.id}),mkItem('TEXT',0,0,'oil',{link:it.id}));
    layoutLinked(it,l);
  }
  if(!l.auto&&it.kind!=='logo')settle([it,...kidsOf(it,l)],l);
  if(!opt?.keepSel)sel=new Set(added);
  if(l.auto&&!pos&&it.kind!=='logo'){autoArrange();return}
  render();renderProps();commit();
}
let manualTold=false;
function markManual(l){
  if(!l.auto)return;
  l.auto=false;
  if(!manualTold){manualTold=true;toast('Elle yerleşime geçildi. Otomatik dizilimi etiket panelinden açabilirsin.')}
}
function autoArrange(){
  const l=cur(),a=workArea(l),W=l.w;
  const free=l.items.filter(i=>i.kind!=='logo'&&!i.link);
  const screens=free.filter(i=>i.kind==='hole'&&i.shape==='r');
  const oils=free.filter(i=>i.cat==='OILSW');
  const big=free.filter(i=>i.kind==='hole'&&i.shape!=='r'&&i.d>=20&&i.cat!=='OILSW');
  const stops=free.filter(i=>i.kind==='estop');
  const sideLamps=free.filter(i=>catOf(i.cat)?.side);
  const small=free.filter(i=>i.kind==='hole'&&i.shape!=='r'&&i.d<20&&!catOf(i.cat)?.side);
  const texts=free.filter(i=>i.kind==='text');
  const rows=[];const chunk=(arr,n)=>{for(let i=0;i<arr.length;i+=n)rows.push(arr.slice(i,i+n))};
  /* ayni butonun tekrarlari alta gider: aralarindaki mesafe buyuk kalsin */
  const seen=new Set(),first=[],rest=[];
  const partners=new Set(l.items.flatMap(i=>i.cat==='CIFTEL'?(i.pairs||[]):[]));
  const scrIds=new Set(screens.map(i=>i.id));
  const hmiT=screens.some(i=>i.hmiTest);
  for(const it of big){if(seen.has(it.cat)||partners.has(it.id)||(hmiT&&it.cat==='SEPET')||(it.cat==='CIFTEL'&&(it.pairs||[]).some(x=>scrIds.has(x))))rest.push(it);else{seen.add(it.cat);first.push(it)}}
  const repeated=new Set(rest.map(i=>i.cat));
  const prio=i=>(repeated.has(i.cat)?1:0)+(i.cat==='CIFTEL'&&(i.pairs||[]).length?1:0);
  first.sort((p,q)=>prio(q)-prio(p));
  const perRow=W>=300?3:2;
  screens.forEach(s=>rows.push([s]));
  chunk(first,perRow);chunk(sideLamps,2);oils.forEach(s=>rows.push([s]));chunk(texts,1);stops.forEach(s=>rows.push([s]));
  if(rest.length){chunk(small,3);chunk(rest,perRow)}else chunk(small,3);
  for(const it of[...big,...small]){if(it.tp!=='none'){it.tp='below';it.tdx=0;it.tdy=0;it.gap=5;it.maxW=0}}
  for(const it of[...screens,...oils])layoutLinked(it,l);
  /* yan yazili lambalar: solda yazi sagda, sagda yazi solda (ornek etiketteki gibi) */
  const setSides=()=>{for(const r of rows)r.forEach((it,ci)=>{if(catOf(it.cat)?.side&&it.tp!=='none'){it.tp=r.length>1&&ci===r.length-1?'left':'right';it.tdx=0;it.tdy=0;it.gap=4;it.maxW=0}})};
  setSides();
  const colX={1:[.5],2:[.22,.78],3:[.22,.5,.78],4:[.14,.38,.62,.86]};
  /* satirdaki yazilar yan yana sigmiyorsa satiri bol */
  for(let i=0;i<rows.length;i++){
    const r=rows[i];if(r.length<2)continue;
    const bx=r.map((it,ci)=>{const q=groupBox(it,l),nx=clamp(W*colX[r.length][ci],a.left-q.x0,a.right-q.x1);return{x0:nx+q.x0,x1:nx+q.x1,y0:0,y1:1}});
    if(bx.some((q,ci)=>ci&&hitBox(bx[ci-1],q,3))){const m=Math.ceil(r.length/2);rows.splice(i,1,r.slice(0,m),r.slice(m));i--;setSides()}
  }
  const heights=rows.map(r=>{let t=0,b=0;for(const i of r){const q=groupBox(i,l);t=Math.min(t,q.y0);b=Math.max(b,q.y1)}return{t,b}});
  const total=heights.reduce((s,h)=>s+h.b-h.t,0),space=a.bottom-a.top;
  const spread=rest.length>0&&rows.length>1;
  const gap=Math.max(2,spread?(space-total-8)/(rows.length-1):(space-total)/(rows.length+1));
  let y=spread?a.top+4:a.top+gap;
  rows.forEach((r,ri)=>{
    const h=heights[ri],cy=y-h.t;
    r.forEach((it,ci)=>{
      const q=groupBox(it,l),nx=it.cat==='OILSW'?Math.max(W*.22,a.left+fpHalf(it)[0]):clamp(W*colX[r.length][ci],a.left-q.x0,a.right-q.x1);

    });
    y+=h.b-h.t+gap;
  });
  render();renderProps();commit();
  if(total+rows.length*2>space)toast('Hepsi bu ölçüye sığmıyor. Uyarılara bak.',true);
}

function onField(el,done){
  const f=el.dataset.f,l=cur();if(!f)return;
  if(f.startsWith('fx.')){P.fixed[f.slice(3)]=el.value;render();return}
  if(f==='l.auto'){if(done){l.auto=el.checked;if(l.auto){autoArrange();renderProps()}}return}
  if(f.startsWith('l.')){
    const k=f.slice(2);
    if(k==='sideY'){
      if(!done)return;
      const a=el.value.split(/[;\s]+/).map(parseNum).filter(v=>v!=null&&v>0&&v<l.h);
      l.sideY=a;l.sideAuto=false;render();return;
    }
    const v=parseNum(el.value);if(v==null)return;
    if(k==='h'||k==='w'){if(!done)return;setLabelSize(l,k==='w'?v:l.w,k==='h'?v:l.h);if(l.auto)autoArrange();fit();render();syncTabs();const tt=$('#props .ttl');if(tt)tt.textContent=`Etiket ${labelName(l)} mm`;el.value=nf(k==='w'?l.w:l.h,2);const sy=$('#props [data-f="l.sideY"]');if(sy)sy.value=l.sideY.map(q=>nf(q)).join(' ; ');return}
    if(k==='qty'){l.qty=Math.max(1,Math.round(v));syncTabs();return}
    if(k==='sideN'){if(!done)return;l.sideY=sideAuto(l.h,clamp(Math.round(v),0,8));l.sideAuto=true;render();const sy=$('#props [data-f="l.sideY"]');if(sy)sy.value=l.sideY.map(q=>nf(q)).join(' ; ');return}
    return;
  }
  if(f==='dimVal'){
    if(!done)return;
    const d=(l.dims||[]).find(q=>q.id===selDim),v=parseNum(el.value);
    if(d&&v!=null&&v>=0&&setDimValue(d,v,l)){render();renderProps()}
    else if(d){const g=dimGeom(d,l);el.value=g?nf(g.v,2):''}
    return;
  }
  const items=l.items.filter(i=>sel.has(i.id));
  if(!items.length)return;
  if(f==='dx'||f==='dy'){
    const v=parseNum(el.value);if(v==null||items.length!==2)return;
    const[a,b]=items,ids=[...sel],fst=items.find(i=>i.id===ids[0]),oth=fst===a?b:a;
    markManual(l);
    if(f==='dx'){oth.x=fst.x+(oth.x>=fst.x?v:-v)}else{oth.y=fst.y+(oth.y>=fst.y?v:-v)}
    render();return;
  }
  const it=items[0];
  if(f==='hmiTest'){
    if(done)setHmiTest(it,el.checked);
    return;
  }
  if(f==='cover'){
    if(!done)return;
    setCover(it,el.checked);
    if(l.auto)autoArrange();else{render();renderProps()}
    return;
  }
  if(f.startsWith('t.')){
    it.t=it.t||{};it.t[f.slice(2)]=el.value;
    shareText(it,l,f.slice(2));
    const row=el.closest('.tr');
    if(row&&(row.classList.contains('pri')||row.classList.contains('sec2')))row.classList.toggle('miss',!el.value);
    el.rows=Math.max(1,el.value.split('\n').length);
    render();return;
  }
  if(f==='phrase'){
    if(!el.value)return;
    it.t=clone(PHRASES[el.value][1]);
    shareText(it,l);
    if(it.kind==='hole'&&it.tp==='none')it.tp='below';
    render();renderProps();commit();return;
  }
  const v=parseNum(el.value);if(v==null)return;
  const r=m=>Math.max(m,v);
  const x0_=it.x,y0_=it.y;
  if(['x','y','xr','yb'].includes(f))markManual(l);
  switch(f){
    case'x':it.x=v;break;case'y':it.y=v;break;case'xr':it.x=l.w-v;break;case'yb':it.y=l.h-v;break;
    case'cw':it.cw=r(35);if(l.auto&&done)autoArrange();break;case'ch':it.ch=r(35);if(l.auto&&done)autoArrange();break;
    case'd':it.d=r(1);if(it.kind==='hole'&&it.fpw&&it.fpw<it.d&&it.shape!=='r'){it.fpw=it.fph=it.d}break;
    case'w':it.w=r(1);if(it.kind==='logo')break;break;
    case'h':it.h=r(1);break;
    case'fp':it.fpw=it.fph=r(34);break;
    case'fs':it.fs=r(1);break;case'fs2':it.fs2=r(1);break;
    case'gap':it.gap=v;break;case'maxW':it.maxW=Math.max(0,v);break;
    default:return;
  }
  kidsOf(it,l).forEach(c=>{c.x+=it.x-x0_;c.y+=it.y-y0_});
  render();
  if(['x','y','xr','yb'].includes(f)&&done)syncPosFields(it);
}

    }
    case'del':{
      l.items=l.items.filter(i=>!sel.has(i.id)&&!(i.link&&sel.has(i.link)));
      for(const o of l.items)if(o.pairs)o.pairs=o.pairs.filter(x=>l.items.some(q=>q.id===x));
      sel.clear();
      if(l.auto){autoArrange();renderProps();return}
      break;
    }
    case'al-l':{markManual(l);const v=mm(items,'x',Math.min);items.forEach(i=>i.x=v);break}
    case'al-r':{markManual(l);const v=mm(items,'x',Math.max);items.forEach(i=>i.x=v);break}
    case'al-c':{markManual(l);const v=(mm(items,'x',Math.min)+mm(items,'x',Math.max))/2;items.forEach(i=>i.x=v);break}
    case'al-t':{markManual(l);const v=mm(items,'y',Math.min);items.forEach(i=>i.y=v);break}
    case'al-b':{markManual(l);const v=mm(items,'y',Math.max);items.forEach(i=>i.y=v);break}
    case'al-m':{markManual(l);const v=(mm(items,'y',Math.min)+mm(items,'y',Math.max))/2;items.forEach(i=>i.y=v);break}
    case'dist-x':case'dist-y':{
      markManual(l);
      const k=a==='dist-x'?'x':'y',s=[...items].sort((p,q)=>p[k]-q[k]),st=(s[s.length-1][k]-s[0][k])/(s.length-1);
      s.forEach((i,n)=>i[k]=s[0][k]+st*n);break;
    }
    default:return;
  }
  for(const it of l.items){
    const b0=before.get(it.id);if(!b0)continue;
    const dx=it.x-b0[0],dy=it.y-b0[1];
    if(dx||dy)kidsOf(it,l).forEach(c=>{if(!sel.has(c.id)){c.x+=dx;c.y+=dy}});
  }
  render();renderProps();commit();
}

function spacingTargets(vals){
  const a=[...vals].sort((p,q)=>p-q),out=[];
  for(let i=0;i+1<a.length;i++){
    const g=a[i+1]-a[i];if(g<1)continue;
    out.push(a[a.length-1]+g,a[0]-g,(a[i]+a[i+1])/2);
  }
  return out;
}
const isSpaced=o=>o.kind==='hole'||o.kind==='estop';
function alignedOthers(k,v,l,ids){return l.items.filter(o=>!ids.has(o.id)&&isSpaced(o)&&Math.abs(o[k]-v)<.26)}
function snapAxis(v,axis,l,ids,thr,alt,extra=[]){
  if(alt){return{v:Math.round(v*10)/10,g:null}}
  const size=axis==='x'?l.w:l.h,T=[];
  if(axis==='x')T.push(l.w/2);
  for(const o of l.items){
    if(ids.has(o.id)||o.kind==='logo')continue;
    T.push(o[axis]);if(axis==='x')T.push(l.w-o.x);
  }
  let best=null,bd=thr,fromExtra=false;
  for(const t of T){const d=Math.abs(t-v);if(d<bd){bd=d;best=t}}
  for(const t of extra){const d=Math.abs(t-v);if(d<bd){bd=d;best=t;fromExtra=true}}
  if(best!=null)return{v:best,g:fromExtra?null:best};
  return{v:Math.round(v*2)/2,g:null};
}

window.addEventListener('keydown',e=>{
  const typing=e.target.matches?.('input,textarea,select');
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){
    e.preventDefault();
    if(document.querySelector('dialog[open]'))return;
    if(e.shiftKey)openSaveDlg(true);else saveProject();
    return;
  }
  if(typing||$('dialog[open]'))return;
  if(e.code==='Space'){spaceDown=true;cv.classList.add('pan');e.preventDefault();return}
  if(e.ctrlKey||e.metaKey){
    const k=e.key.toLowerCase();
    if(k==='z'){e.preventDefault();undo(e.shiftKey?1:-1)}
    else if(k==='y'){e.preventDefault();undo(1)}
    else if(k==='d'&&sel.size){e.preventDefault();doAct('dup')}
    else if(k==='a'){e.preventDefault();sel=new Set(cur().items.map(i=>i.id));drawOverlay();renderProps()}
    return;
  }
  if(e.key==='Enter'&&dimTool?.step===4){e.preventDefault();saveDim();return}
  if(e.key==='Escape'&&dimTool){if(dimTool.step>1)draftReset();else exitDimTool();return}
  if((e.key==='Delete'||e.key==='Backspace')&&selDim){e.preventDefault();deleteSelDim();return}
  if(e.key==='Escape'&&selDim){selDim=null;renderProps();drawOverlay();return}
  if(e.key==='f'||e.key==='F'){fit();return}
  if(e.key==='Escape'){sel.clear();drawOverlay();renderProps();return}
  if((e.key==='Delete'||e.key==='Backspace')&&sel.size){e.preventDefault();doAct('del');return}
  const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(dir&&sel.size){
    e.preventDefault();const st=e.shiftKey?10:e.altKey?.1:1,l=cur();
    markManual(l);
    nudgeShow=true;clearTimeout(nudgeShowT);nudgeShowT=setTimeout(()=>{nudgeShow=false;drawOverlay()},1600);

    render();if(sel.size===1)syncPosFields(l.items.find(i=>sel.has(i.id)));
    clearTimeout(nudgeT);nudgeT=setTimeout(commit,300);
  }
});

/* ---------- kaydet / aç ----------
   Kurallar:
   1. Acik proje bir DOSYAYA baglidir. Kaydet yalniz o dosyaya yazar.
   2. Ustteki ad dosyanin adidir. Yeni dosya sadece Farkli kaydet ile ya da hic
      kaydedilmemis projenin ilk kaydinda olusur.
   3. Baska bir dosyanin uzerine yazmak icin her zaman sorulur, onerilen ad
      asla var olan bir dosya olmaz.
   4. Uzerine yazilan her dosyanin eski hali Yedekler klasorune kopyalanir.
   5. Gercek diskte yazma ~1,3 sn surer. Bu arada yapilan degisiklik "kaydedildi"
      sayilmaz ve yazma bitmeden baska proje acilmaz.
   6. Proje ya klasorde ya veritabanindadir, ikisi kendiliginden esitlenmez. Veritabani
      kaydi once bu cihaza yazilir, sonra depoya commit olur. Baska bilgisayar dosyayi
      degistirdiyse sha tutmaz ve sorulur.
   7. Erisim anahtari ana ekranda girilir, bu programda tutulmaz. */
const EXT='.panoetiket.json',BACKUP_DIR='Yedekler',BACKUP_KEEP=20;

  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
};

const fileBase=n=>String(n).replace(/\.panoetiket\.json$|\.json$/i,'');

let backupQ=Promise.resolve();
const stampNow=()=>{const t=new Date(),p=n=>String(n).padStart(2,'0');return`${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}-${p(t.getHours())}${p(t.getMinutes())}${p(t.getSeconds())}`};
function queueBackup(base,text){
  backupQ=backupQ.then(()=>writeBackup(base,text)).catch(e=>console.warn('yedek alınamadı',e));
  return backupQ;

async function writeBackup(base,text){
  const d=dirH||await getDir(false);if(!d)return;
  const bd=await d.getDirectoryHandle(BACKUP_DIR,{create:true});
  const fh=await bd.getFileHandle(`${base}__${stampNow()}.json`,{create:true});
  const w=await fh.createWritable();await w.write(text);await w.close();
  const same=[];
  for await(const[n]of bd.entries())if(n.startsWith(base+'__')&&n.endsWith('.json'))same.push(n);
  same.sort();
  for(const n of same.slice(0,Math.max(0,same.length-BACKUP_KEEP)))await bd.removeEntry(n);
}
async function lookupHandle(){
  if(doc.handle)return doc.handle;

  try{const h=await idb.get(fileKey(doc.file,doc.dir));if(h){doc.handle=h;return h}}catch(e){}

/* ---- Veritabani ----
   Projeler ELECTRICX veritabaninda durur: ETIKET/projeler/<ad>.panoetiket.json
   Karar mantigi degismedi: sha tutmazsa sorulur, hicbir sey sessizce ezilmez.
   Uzerine yazilan her kaydin eski hali Yedekler altina kopyalanir, depoda gecmisi de durur. */
const GH_REPO='ELECTRICX veritabanı',DB_KOK='ETIKET/projeler/',DB_YEDEK=DB_KOK+BACKUP_DIR+'/',PLACE_KEY='panoetiket.place';
const ghDb=()=>ExBoot.ready();
function rememberPlace(v){try{localStorage.setItem(PLACE_KEY,v)}catch(e){}}
function defaultPlace(){
  if(doc.gh)return'gh';
  if(doc.file)return'local';
  let s='';
  try{s=localStorage.getItem(PLACE_KEY)||''}catch(e){}
  return s||'gh';
}
function ghErr(kind,msg,status){const e=new Error(msg);e.name='GhError';e.kind=kind;e.status=status;return e}
async function ghList(){
  const db=await ghDb();
  return(await db.list(DB_KOK))
    .filter(r=>r.kind==='file'&&r.path.endsWith(EXT)&&!r.path.slice(DB_KOK.length).includes('/'))
    .map(r=>({name:r.path.slice(DB_KOK.length),sha:r.hash,at:r.at}));
}
async function ghGet(name,ref){
  const db=await ghDb(),g=await db.read(ref||DB_KOK+name);
  if(!g||g.kind!=='file')throw ghErr('notfound','Bulunamadı',404);
  return{text:new TextDecoder().decode(g.bytes),sha:g.hash};
}
async function ghYedek(name,text){
  const db=await ghDb(),base=fileBase(name);
  await db.writeText(`${DB_YEDEK}${base}__${stampNow()}.json`,text);
  const same=(await db.list(DB_YEDEK)).map(r=>r.path).filter(p=>p.slice(DB_YEDEK.length).startsWith(base+'__')).sort();
  for(const p of same.slice(0,Math.max(0,same.length-BACKUP_KEEP)))await db.remove(p);
}
async function ghPut(name,text,sha){
  const db=await ghDb(),path=DB_KOK+name,cur=await db.meta(path);
  if(sha&&!cur)throw ghErr('notfound','Bulunamadı',404);
  if(cur&&cur.hash!==sha)throw ghErr('conflict','Çakışma',409);
  if(cur){
    const eski=await ghGet(name);
    if(eski.text!==text)await ghYedek(name,eski.text);
  }
  const bytes=new TextEncoder().encode(text);
  await db.write(path,bytes);
  const got=await db.meta(path);
  if(!got||got.hash!==await ExDb.gitBlobSha(bytes))throw ghErr('server','Yazılan kayıt doğrulanamadı');
  return got.hash;
}
/* yazma suresince dugmeler kilitli, yazilan anin kopyasi saklanir */
async function ghWrite(name,sha){
  const snapshot=hist[hi],json=serialize();
  writing++;syncSaveBtn();
  try{return{sha:await ghPut(name,json,sha),json,snapshot}}
  finally{writing--;syncSaveBtn()}
}
const ghDoc=(name,sha,text)=>({file:name,handle:null,mod:0,dir:'',gh:true,sha,text});
async function ghSave(){
  if(doc.sha&&doc.text===serialize()){
    markSavedAt(hist[hi]);toast('Değişiklik yok, kaydedilecek bir şey yok.');
    return true;
  }
  const d0=doc;
  try{
    const r=await ghWrite(doc.file,doc.sha);
    if(doc===d0){doc.sha=r.sha;doc.text=r.json}
    markSavedAt(r.snapshot);
    toast(`Kaydedildi: ${doc.file}`);
    return true;
  }catch(e){
    if(e.kind==='conflict'||e.kind==='notfound')return ghConflict();
    toast(`Kaydedilemedi: ${e.message}. Değişikliklerin bu tarayıcıda duruyor.`,true,6500);
    return false;
  }
}
/* sha tutmadi: ya baska bilgisayar yazdi ya dosya silindi. Asla sessizce ezilmez. */
async function ghConflict(){
  let now=null;
  try{now=await ghGet(doc.file)}
  catch(e){
    if(e.kind!=='notfound'){toast(`Kaydedilemedi: ${e.message}. Değişikliklerin bu tarayıcıda duruyor.`,true,6500);return false}
  }
  if(!now){
    const ok=await confirmBox('Kayıt veritabanında yok',`"${doc.file}" veritabanından silinmiş. Kaydedersen yeniden oluşturulur.`,'Yeniden oluştur');
    if(!ok)return false;
    doc.sha=null;doc.text=null;
    return ghSave();
  }
  /* zaman asimina ugrayan yazma aslinda tutmus olabilir */
  if(now.text===serialize()){
    doc.sha=now.sha;doc.text=now.text;markSavedAt(hist[hi]);
    toast(`Kaydedildi: ${doc.file}`);
    return true;
  }
  if(isNewer(now.text)){
    toast(NEWER_MSG+' Üzerine yazılmadı, ayrı dosya olarak kaydedebilirsin.',true,8000);
    return askSaveName(true);
  }
  const v=await choiceBox('Dosya başka yerde değişmiş',`"${doc.file}" sen açtıktan sonra başka bir yerde kaydedilmiş. Üzerine yazarsan oradaki son hali ekrandan gider, Yedekler'de ve depo geçmişinde kalır.`,'Üzerine yaz','Ayrı dosya olarak kaydet');
  if(v==='ok'){doc.sha=now.sha;doc.text=null;return ghSave()}
  if(v==='alt')return askSaveName(true);
  return false;
}

    let disk;

function parseProject(text){
  let obj;
  try{obj=JSON.parse(text)}catch(e){throw new Error('Dosya okunamadı, JSON bozuk')}
  if(!obj||obj.format!=='dolfin-pano-etiket'||!Array.isArray(obj.labels)||!obj.labels.length||!obj.labels.every(l=>Array.isArray(l.items)&&l.h>0&&l.w>0))throw new Error('Bu dosya bir pano etiketi projesi değil');
  if((obj.version||1)>FORMAT_VERSION)throw new Error(NEWER_MSG);
  for(const l of obj.labels)l.sideY=Array.isArray(l.sideY)?l.sideY:[];
  const active=obj.active;delete obj.active;
  return{project:migrate(obj),active};
}
function loadProject(parsed,newDoc){

  if(newDoc&&newDoc.file)pr.name=displayName(newDoc.file);

/* iki proje arasindaki fark: acilan dosya ekranda ayni gorunuyorsa kullaniciya soylenir */
function contentDiff(a,b){
  let n=Math.abs(a.labels.length-b.labels.length)*3;
  for(let i=0;i<Math.min(a.labels.length,b.labels.length);i++){
    const x=a.labels[i],y=b.labels[i];
    if(x.h!==y.h||x.w!==y.w)n++;
    if((x.langs||[]).join()!==(y.langs||[]).join())n++;
    const m=new Map(y.items.map(q=>[q.id,q]));
    for(const it of x.items){
      const o=m.get(it.id);
      if(!o)n++;
      else{
        if(o.x!==it.x||o.y!==it.y||o.cat!==it.cat||JSON.stringify(o.t||{})!==JSON.stringify(it.t||{}))n++;
        m.delete(it.id);
      }
    }
    n+=m.size+Math.abs((x.dims||[]).length-(y.dims||[]).length);
  }
  return n;
}

function rowInfo(text){

}

const ghMemo=new Map();

const stampMs=t=>{const m=/^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)$/.exec(t);return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime():0};
async function ghHistory(){

}

const TAB_ID=uid();let lastPong=0;
function tabSay(k,v){try{localStorage.setItem(k,JSON.stringify(Object.assign({id:TAB_ID,t:Date.now()},v||{})))}catch(e){}}
function setOtherTab(on){if(on!==otherTab){otherTab=on;if(P)syncDoc()}}
window.addEventListener('storage',e=>{
  if(!e.newValue)return;
  let m=null;try{m=JSON.parse(e.newValue)}catch(x){return}

  if(e.key==='panoetiket.ping'){tabSay('panoetiket.pong',{to:m.id});lastPong=Date.now();setOtherTab(true)}

function download(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),15000);
}
function withLang(l,lang){return lang?Object.assign({},l,{langs:[lang,...langsOf(l).filter(k=>k!==lang)]}):l}
function labelPage(l0,o){
  const l=withLang(l0,o.lang),prims=[...staticPrims(l,o.cut)];
  for(const it of l.items)for(const p of itemPrims(it,l)){if(p.role==='cut'&&!o.cut)continue;prims.push(Object.assign({},p,{d:shift(p.d,it.x,it.y)}))}
  if(o.dims)prims.push(...dimPrims(l));
  const m=o.dims&&(l.dims||[]).length?42:5;
  return{name:`${labelName(l)}_${langTag(l)}`,w:l.w,h:l.h,mx:m,my:m,trim:true,prims:orderPrims(prims)};
}
const orderPrims=a=>[...a.filter(p=>p.role==='print'),...a.filter(p=>p.role==='cut'),...a.filter(p=>p.role==='dim')];
function sheetPage(list,o){
  const hasD=o.dims&&list.some(q=>(q.label.dims||[]).length),gap=hasD?100:45,mg=hasD?45:25,cap=26;let x=0,H=0;const prims=[];
  list.forEach(({label,lang})=>{
    const l=withLang(label,lang),pg=labelPage(l,Object.assign({},o,{lang:null}));
    for(const p of pg.prims)prims.push(Object.assign({},p,{d:shift(p.d,x,0)}));
    const c=`${labelName(l)} mm`+(l.qty>1?`  ${l.qty} ADET`:'')+`  ${langsOf(l).map(k=>k.toUpperCase()).join(' ')}`;
    prims.push({d:textCmds(c,'o',12,x+l.w/2,l.h+18),fill:INK,role:'print'});
    x+=l.w+gap;H=Math.max(H,l.h);
  });
  return{name:'seri',w:x-gap,h:H+cap,mx:mg,my:mg,trim:false,prims:orderPrims(prims)};
}
function svgDoc(pg){
  const W=pg.w+2*pg.mx,H=pg.h+2*pg.my,grp=(id,r)=>{const a=pg.prims.filter(p=>p.role===r);return a.length?`<g id="${id}">${a.map(p=>primSvg(p,false)).join('')}</g>`:''};
  return`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${fx(W)}mm" height="${fx(H)}mm" viewBox="${fx(-pg.mx)} ${fx(-pg.my)} ${fx(W)} ${fx(H)}">\n<title>${esc(pg.name)}</title>\n${grp('BASKI','print')}\n${grp('KESIM','cut')}\n${grp('OLCU','dim')}\n</svg>\n`;
}
const hex2rgb=h=>{if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];const v=parseInt(h.slice(1),16);return[(v>>16&255)/255,(v>>8&255)/255,(v&255)/255].map(n=>fx(n,3)).join(' ')};
function pdfContent(pg){
  const k=72/25.4,o=[`q ${fx(k,5)} 0 0 ${fx(-k,5)} ${fx(pg.mx*k,3)} ${fx((pg.h+pg.my)*k,3)} cm 0 J 0 j 4 M`];
  for(const p of pg.prims){
    if(p.fill&&p.fill!=='none')o.push(hex2rgb(p.fill)+' rg');
    if(p.stroke)o.push(hex2rgb(p.stroke)+' RG '+fx(p.sw,3)+' w');
    let s='';
    for(const c of p.d){
      if(c[0]==='M')s+=`${fx(c[1],3)} ${fx(c[2],3)} m\n`;
      else if(c[0]==='L')s+=`${fx(c[1],3)} ${fx(c[2],3)} l\n`;
      else if(c[0]==='C')s+=`${fx(c[1],3)} ${fx(c[2],3)} ${fx(c[3],3)} ${fx(c[4],3)} ${fx(c[5],3)} ${fx(c[6],3)} c\n`;
      else s+='h\n';
    }
    o.push(s+(p.stroke?'S':'f'));
  }
  o.push('Q');
  return o.join('\n');
}
async function deflate(u8){
  if(!('CompressionStream' in window))return null;
  try{
    const cs=new CompressionStream('deflate'),w=cs.writable.getWriter();w.write(u8);w.close();
    return new Uint8Array(await new Response(cs.readable).arrayBuffer());
  }catch(e){return null}
}
async function makePDF(pages,title){
  const enc=new TextEncoder(),k=72/25.4,chunks=[],off=[];let pos=0;
  const put=x=>{const u=typeof x==='string'?enc.encode(x):x;chunks.push(u);pos+=u.length};
  const objStart=n=>{off[n]=pos;put(`${n} 0 obj\n`)};
  const n=pages.length,pageNo=i=>3+i*2,contNo=i=>4+i*2,infoNo=3+n*2;
  put('%PDF-1.5\n%\xE2\xE3\xCF\xD3\n');
  objStart(1);put('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  objStart(2);put(`<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>pageNo(i)+' 0 R').join(' ')}] >>\nendobj\n`);
  for(let i=0;i<n;i++){
    const pg=pages[i],W=(pg.w+2*pg.mx)*k,H=(pg.h+2*pg.my)*k;
    objStart(pageNo(i));
    let box=`/MediaBox [0 0 ${fx(W,3)} ${fx(H,3)}]`;
    if(pg.trim)box+=` /TrimBox [${fx(pg.mx*k,3)} ${fx(pg.my*k,3)} ${fx((pg.mx+pg.w)*k,3)} ${fx((pg.my+pg.h)*k,3)}]`;
    put(`<< /Type /Page /Parent 2 0 R ${box} /Resources << >> /Contents ${contNo(i)} 0 R >>\nendobj\n`);
    const raw=enc.encode(pdfContent(pg)),z=await deflate(raw),body=z||raw;
    objStart(contNo(i));
    put(`<< /Length ${body.length}${z?' /Filter /FlateDecode':''} >>\nstream\n`);put(body);put('\nendstream\nendobj\n');
  }
  const hexStr=s=>{let h='FEFF';for(let i=0;i<s.length;i++)h+=s.charCodeAt(i).toString(16).padStart(4,'0').toUpperCase();return`<${h}>`};
  objStart(infoNo);put(`<< /Title ${hexStr(title)} /Producer (Pano Etiketi) >>\nendobj\n`);
  const xref=pos,cnt=infoNo+1;
  let t=`xref\n0 ${cnt}\n0000000000 65535 f \n`;
  for(let i=1;i<cnt;i++)t+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  t+=`trailer\n<< /Size ${cnt} /Root 1 0 R /Info ${infoNo} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;put(t);
  return new Blob(chunks,{type:'application/pdf'});
}
/* ZIP (sıkıştırmasız) */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=~0;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(~c)>>>0};
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let pos=0;
  const d=new Date(),time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  const hdr=(sig,extra,nameLen,crc,size)=>{const b=new DataView(new ArrayBuffer(extra?46:30));let p=0;const w=v=>{b.setUint16(p,v,true);p+=2},W=v=>{b.setUint32(p,v,true);p+=4};
    W(sig);if(extra)w(20);w(20);w(0x0800);w(0);w(time);w(date);W(crc);W(size);W(size);w(nameLen);w(0);
    if(extra){w(0);w(0);w(0);W(0);W(extra.off)}
    return new Uint8Array(b.buffer)};
  for(const f of files){
    const nm=enc.encode(f.name),u=enc.encode(f.text),c=crc32(u),off=pos,h=hdr(0x04034b50,null,nm.length,c,u.length);
    parts.push(h,nm,u);pos+=h.length+nm.length+u.length;
    cen.push(hdr(0x02014b50,{off},nm.length,c,u.length),nm);
  }
  const cstart=pos;let csize=0;for(const c of cen){parts.push(c);csize+=c.length}
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,cstart,true);
  parts.push(new Uint8Array(e.buffer));
  return new Blob(parts,{type:'application/zip'});
}
const expS={fmt:'pdf',scope:'one',layout:'pages'};
function openExport(fmt){
  expS.fmt=fmt;
  $('#expTitle').textContent=fmt==='pdf'?'PDF indir':'SVG indir';
  $('#expLangs').innerHTML=LKEYS.map(k=>`<label class="chk"><input type="checkbox" value="${k}" ${k===langsOf(cur())[0]?'checked':''}><span>${k.toUpperCase()}</span></label>`).join('');
  $('#xDims').checked=P.labels.some(q=>(q.dims||[]).length);
  syncExp();
  $('#dlgExp').returnValue='cancel';
  $('#dlgExp').showModal();
}
function pickedLangs(){return $$('#expLangs input:checked').map(i=>i.value)}
function syncExp(){
  const langMode=$('input[name=xl]:checked').value;
  $$('#expScope button').forEach(b=>b.classList.toggle('on',b.dataset.v===expS.scope));
  $$('#expLayout button').forEach(b=>b.classList.toggle('on',b.dataset.v===expS.layout));
  $('#expLangs').style.opacity=langMode==='pick'?1:.45;
  $$('#expLangs input').forEach(i=>i.disabled=langMode!=='pick');
  $('#xQtyW').style.display=expS.fmt==='pdf'&&expS.layout==='pages'?'flex':'none';
  const ls=expS.scope==='one'?1:P.labels.length,lg=langMode==='pick'?pickedLangs().length:1;
  const count=ls*lg;
  let note='';
  if(!count)note='En az bir dil seç.';
  else if(expS.layout==='sheet')note=`${count} etiket tek ${expS.fmt==='pdf'?'PDF sayfasında':'SVG dosyasında'} yan yana dizilir, altlarına ölçü ve adet yazılır.`;
  else if(expS.fmt==='pdf')note=count===1?'Tek sayfalık PDF. Sayfa, etiket ölçüsünden her yanda 5 mm büyüktür.':`${count} sayfalık tek PDF.`;
  else note=count===1?'Tek SVG. KESIM ve BASKI ayrı gruplardadır.':`${count} SVG, tek ZIP içinde.`;
  note+=' Yazılar çizgiye çevrilir, baskıda yazı tipi gerekmez.';
  $('#expNote').textContent=note;
  $('#xOk').disabled=!count;
}
$('#bPdf').onclick=()=>openExport('pdf');$('#bSvg').onclick=()=>openExport('svg');
$('#expScope').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){expS.scope=b.dataset.v;syncExp()}});
$('#expLayout').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){expS.layout=b.dataset.v;syncExp()}});
$('#fExp').addEventListener('change',syncExp);
$('#dlgExp').addEventListener('close',()=>{if($('#dlgExp').returnValue==='ok')doExport()});
async function doExport(){
  const o={cut:$('#xCut').checked,dims:$('#xDims').checked};
  const langs=$('input[name=xl]:checked').value==='pick'?pickedLangs():[null];
  const ls=expS.scope==='one'?[cur()]:P.labels;
  const list=[];for(const label of ls)for(const lang of langs)list.push({label,lang});
  const base=safeName(P.name);
  try{
    if(expS.layout==='sheet'){
      const pg=sheetPage(list,o);
      if(expS.fmt==='pdf')download(await makePDF([pg],P.name),`${base}_seri.pdf`);
      else download(new Blob([svgDoc(pg)],{type:'image/svg+xml'}),`${base}_seri.svg`);
    }else{
      let pages=list.map(({label,lang})=>Object.assign(labelPage(label,Object.assign({},o,{lang})),{qty:label.qty}));
      if(expS.fmt==='pdf'){
        if($('#xQty').checked)pages=pages.flatMap(p=>Array(p.qty||1).fill(p));
        const nm=pages.length===1?`${base}_${pages[0].name}.pdf`:`${base}_seri.pdf`;
        download(await makePDF(pages,P.name),nm);
      }else if(pages.length===1){
        download(new Blob([svgDoc(pages[0])],{type:'image/svg+xml'}),`${base}_${pages[0].name}.svg`);
      }else{
        const seen={},files=pages.map(p=>{let n=`${base}_${p.name}`;seen[n]=(seen[n]||0)+1;if(seen[n]>1)n+=`_${seen[n]}`;return{name:n+'.svg',text:svgDoc(p)}});
        download(makeZip(files),`${base}_seri_svg.zip`);
      }
    }
    toast('İndirme başladı');
  }catch(e){console.error(e);toast('Dışa aktarılamadı: '+e.message,true)}
}

function boot(){
  let st=null,clean=true,active=0;
  try{st=JSON.parse(sessionStorage.getItem(STATE_KEY)||localStorage.getItem(STATE_KEY)||'null')}catch(e){}
  /* onceki surumun otomatik kaydi */
  let old=null;
  try{const s=localStorage.getItem('panoetiket.autosave');if(s)old=JSON.parse(s)}catch(e){}
  if(old&&old.format==='dolfin-pano-etiket'&&old.labels?.length&&isOldDemo(old)){
    try{localStorage.setItem('panoetiket.autosave.v1',JSON.stringify(old))}catch(e){}
    old=null;
  }
  try{localStorage.removeItem('panoetiket.autosave')}catch(e){}
  P=null;
  try{
    if(st&&st.json){
      const parsed=parseProject(st.json);
      P=parsed.project;active=st.active||0;clean=!!st.clean;
      doc={file:st.file||null,handle:null,mod:st.mod||0,dir:st.dir||''};
      if(st.gh&&st.file){doc.gh=true;doc.sha=st.sha||null}
      if(doc.file)P.name=displayName(doc.file);
    }else if(old){
      P=parseProject(JSON.stringify(old)).project;clean=false;
    }
  }catch(e){P=null;doc=emptyDoc()}
  if(!P){P=newProject();clean=true}
  A=clamp(active,0,P.labels.length-1);syncAll();
  requestAnimationFrame(()=>{fit();render()});
  resetHist();
  if(!clean){savedJson='';syncDirty();writeState()}
  syncDoc();
  tabSay('panoetiket.ping');
  checkDisk();
}
